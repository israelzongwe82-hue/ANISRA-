<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#6042bd">
<title>ANISRA</title>
<style>
:root{--violet:#6946c8;--blue:#2878df;--bg:#f4f5fa;--panel:#fff;--text:#202238;--muted:#777b91;--line:#e9e9f1;--soft:#f0ecfb;--mine:#e9e2ff;--theirs:#f0f1f6;--good:#20a875;--danger:#d84b5b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Arial,Helvetica,sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.app{max-width:760px;margin:auto;min-height:100vh;background:var(--panel);position:relative;padding-bottom:82px;box-shadow:0 0 30px #25204a0a}
.top{height:66px;padding:0 15px;display:flex;align-items:center;justify-content:space-between;color:white;background:linear-gradient(110deg,var(--violet),var(--blue));position:sticky;top:0;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;letter-spacing:1px}.mark{width:37px;height:34px;position:relative}.mark:before,.mark:after{content:"";position:absolute;width:22px;height:22px;border:4px solid #fff;border-radius:12px 12px 12px 4px}.mark:before{top:1px;left:0}.mark:after{right:0;bottom:0;border-radius:12px 12px 4px 12px;opacity:.8}
.actions{display:flex;gap:5px}.headbtn{width:40px;height:40px;border:0;background:transparent;color:white;font-size:23px;border-radius:50%}.headbtn:active{background:#ffffff25}
.menu{display:none;position:absolute;right:12px;top:58px;background:var(--panel);color:var(--text);box-shadow:0 8px 25px #0002;border:1px solid var(--line);border-radius:13px;padding:6px;width:205px;z-index:30}.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;padding:12px;border:0;background:none;color:inherit;border-radius:8px}.menu button:hover{background:var(--soft)}
.search{display:none;padding:12px 15px}.search.show{display:block}.field{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text)}
.page{padding:0 14px}.heading{display:flex;align-items:center;justify-content:space-between;padding:18px 3px 12px}.heading h1{font-size:21px;margin:0}.sub{font-size:12px;color:var(--muted)}
.tabs{position:fixed;z-index:15;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(5,1fr);background:var(--panel);border-top:1px solid var(--line);padding:7px 3px max(7px,env(safe-area-inset-bottom))}
.tab{border:0;background:none;color:var(--muted);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;padding:5px 0;border-radius:11px;font-size:10px;font-weight:600;min-width:0}.tab .ico{font-size:21px}.tab.active{color:var(--violet);background:var(--soft)}
.fab img{width:100%;height:100%;object-fit:cover;border-radius:50%}.fab{position:fixed;z-index:14;bottom:92px;right:max(18px,calc((100vw - 720px)/2));height:55px;min-width:55px;padding:0 14px;border:0;border-radius:19px 19px 5px 19px;color:white;background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:0 7px 20px #49318b44;font-weight:bold}
.list{display:flex;flex-direction:column}.row{display:flex;align-items:center;gap:12px;padding:12px 5px;border-bottom:1px solid var(--line);cursor:pointer}.avatar{width:49px;height:49px;border-radius:50%;background:linear-gradient(135deg,#e8defe,#dceaff);color:var(--violet);display:grid;place-items:center;font-size:19px;font-weight:bold;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.rowmain{flex:1;min-width:0}.rowtop{display:flex;justify-content:space-between;gap:8px}.rowname{font-weight:700}.time,.preview{font-size:12px;color:var(--muted)}.preview{margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{background:var(--good);color:white;border-radius:20px;min-width:19px;text-align:center;padding:3px 6px;font-size:11px}
.empty{margin:22px 4px;padding:30px 18px;text-align:center;border:1px dashed var(--line);border-radius:17px;color:var(--muted);line-height:1.5}.empty b{display:block;color:var(--text);margin-bottom:7px}
.card{border:1px solid var(--line);border-radius:15px;padding:14px;margin:10px 0;background:var(--panel)}.card h3{font-size:15px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:11px;padding:11px 14px;background:var(--violet);color:white;font-weight:600}.btn.secondary{background:var(--soft);color:var(--violet)}.btn.danger{background:#fff0f1;color:var(--danger)}.btn.small{padding:8px 10px;font-size:12px}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}input,textarea,select{color:var(--text)}textarea{resize:vertical;min-height:80px}
.chatview{position:fixed;inset:0;z-index:40;background:var(--panel);display:none;flex-direction:column;max-width:760px;margin:auto}.chatview.open{display:flex}.selectbar{height:64px;display:none;align-items:center;gap:8px;padding:0 12px;background:linear-gradient(110deg,var(--violet),var(--blue));color:white}.selectbar.show{display:flex}.selectbar .selcount{flex:1;font-weight:700}.selectbar button{border:0;background:#ffffff20;color:white;font-size:25px;width:42px;height:42px;border-radius:10px}.bubble{user-select:none;-webkit-user-select:none;touch-action:pan-y}.bubble.selected{outline:3px solid var(--violet);background:#b9a8f5!important}.chathead{height:64px;display:flex;align-items:center;gap:10px;padding:0 12px;background:linear-gradient(110deg,var(--violet),var(--blue));color:white}.back{border:0;background:none;color:white;font-size:25px;padding:5px}.chathead .avatar{width:40px;height:40px;background:#ffffff30;color:white}.chatwho{flex:1;min-width:0}.chatwho b{display:block}.chatwho small{opacity:.8}.chatbody{flex:1;overflow:auto;padding:15px;background:var(--bg);display:flex;flex-direction:column;gap:9px}.bubble{max-width:83%;padding:10px 12px;border-radius:15px;line-height:1.4;overflow-wrap:anywhere}.bubble.mine{align-self:flex-end;background:var(--mine);border-bottom-right-radius:4px}.bubble.other{align-self:flex-start;background:var(--theirs);border-bottom-left-radius:4px}.bubble small{display:block;text-align:right;font-size:10px;color:var(--muted);margin-top:4px}.ticks{font-weight:800;color:#87909f;letter-spacing:-2px}.ticks.read{color:#168de0}.ticks.pending{color:#9296a5}.msgdelete{float:right;border:0;background:transparent;color:var(--danger);font-size:15px;line-height:1;margin:-3px -5px 3px 8px;padding:3px 5px;border-radius:6px}.msgdelete:active{background:#d84b5b22}.composer{display:flex;gap:7px;align-items:center;padding:9px;background:var(--panel);border-top:1px solid var(--line)}.composer textarea{flex:1;min-height:42px;max-height:110px;padding:11px;border:1px solid var(--line);border-radius:20px;background:var(--bg)}.send{width:43px;height:43px;border:0;border-radius:50%;background:var(--violet);color:white;font-size:18px}
.modalback{position:fixed;inset:0;background:#11182777;z-index:60;display:none;align-items:flex-end;justify-content:center}.modalback.show{display:flex}.modal{width:min(100%,650px);max-height:88vh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:18px 17px 25px}.modalhead{display:flex;align-items:center;justify-content:space-between}.modalhead h2{font-size:19px;margin:0}.close{border:0;background:none;font-size:25px;color:var(--muted)}
.settingrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.settingrow span{font-size:14px}.settingrow input[type=checkbox]{width:19px;height:19px;accent-color:var(--violet)}.settingrow select,.settingrow input[type=range]{max-width:48%}
.status-ring{padding:3px;border:2px solid var(--violet);border-radius:50%}.pill{font-size:11px;color:var(--violet);background:var(--soft);padding:4px 8px;border-radius:20px}
.toast{position:fixed;z-index:80;bottom:100px;left:50%;transform:translateX(-50%);background:#26243b;color:white;padding:11px 15px;border-radius:20px;font-size:13px;display:none;max-width:90%;text-align:center}
body.dark{--bg:#151522;--panel:#202031;--text:#f2f0fb;--muted:#aaa8bd;--line:#38384c;--soft:#353052;--mine:#40365e;--theirs:#303044}
@media(min-width:761px){body{padding:16px 0}.app{min-height:calc(100vh - 32px);border-radius:18px;overflow:hidden}.tabs{bottom:16px;border-radius:0 0 18px 18px}.chatview{top:16px;bottom:16px;border-radius:18px;overflow:hidden}.fab{bottom:108px}}
</style>
</head>

const storeKey = "anisra_prototype_v1";
const state = JSON.parse(localStorage.getItem(storeKey) || "{}");
state.chats ||= []; state.chats.forEach(c=>{if(c.kind==="group"){}else if(c.kind==="ai"||c.name==="Israël-AI")c.kind="ai";else if(!c.kind)c.kind="person";if(!c.id)c.id="chat-"+Math.random().toString(36).slice(2)+Date.now()}); state.statuses ||= []; state.groups ||= []; state.channels ||= []; state.calls ||= []; state.contacts ||= [];
state.settings ||= {theme:"light",font:100,notifications:true,readReceipts:true,autoPhotos:false,autoVideos:false,autoDocs:false,privacyPhoto:"Mes contacts",privacySeen:"Mes contacts",pin:false,fingerprint:false,ephemeral:"Désactivés"};
let currentTab="Discussions", activeChat=null;
const $=id=>document.getElementById(id);
function save(){localStorage.setItem(storeKey,JSON.stringify(state))}
function playMessageSound(){try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;const ctx=new C(),o=ctx.createOscillator(),g=ctx.createGain();o.type="sine";o.frequency.value=880;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.015);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.16);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.17);o.onended=()=>ctx.close()}catch(e){console.warn("Son indisponible",e)}}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function toast(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(window.tt);window.tt=setTimeout(()=>$("toast").style.display="none",2600)}
let modalHistoryOpen=false, chatHistoryOpen=false, handlingPopState=false;
function modal(title,html){$("modalTitle").textContent=title;$("modalContent").innerHTML=html;$("modalBack").classList.add("show");if(!handlingPopState){history.pushState({anisraLayer:"modal"},"");modalHistoryOpen=true}}
function closeModal(fromBack=false){if(!$("modalBack").classList.contains("show"))return;$("modalBack").classList.remove("show");if(modalHistoryOpen&&!fromBack&&!handlingPopState){modalHistoryOpen=false;history.back()}else modalHistoryOpen=false}
function heading(title,sub=""){return `<div class="heading"><h1>${title}</h1><span class="sub">${sub}</span></div>`}
function empty(icon,title,desc){return `<div class="empty"><div style="font-size:30px;margin-bottom:9px">${icon}</div><b>${title}</b>${desc}</div>`}
function avatar(name){if(name==="Israël-AI")return `<div class="avatar ai-avatar"><img src="${AI_LOGO}" alt="Logo Israël-AI"></div>`;return `<div class="avatar">${esc((name||"?").trim().charAt(0).toUpperCase())}</div>`}
function render(){
 document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
 $("aiFab").style.display=currentTab==="Israël-AI"?"none":"block";
 let html="";
 if(currentTab==="Discussions"){
  html=heading("Discussions","Vos conversations");
  const all=[...state.chats].sort((a,b)=>(b.updated||0)-(a.updated||0));
  html+=`<div class="list">${all.length?all.map((c)=>`<div class="row" data-chat-id="${esc(c.id)}">${avatar(c.name)}<div class="rowmain"><div class="rowtop"><span class="rowname">${esc(c.name)}</span><span class="time">${esc(c.time||"")}</span></div><div class="preview">${esc(c.messages?.at(-1)?.text||"Aucune conversation")}</div></div>${c.unread?`<span class="badge">${c.unread}</span>`:""}</div>`).join(""):empty("▤","Aucune discussion pour le moment","Vos conversations apparaîtront ici.")}</div>`;
  html+=`<div class="btnrow"><button class="btn" id="newChat">Nouvelle discussion</button><button class="btn secondary" id="newGroup">Créer un groupe</button></div>`;
 } else if(currentTab==="Statuts"){
  html=heading("Statuts","Publications temporaires");
  html+=`<div class="card"><h3>Mon statut</h3><p class="muted">Partagez un texte, une photo ou une vidéo. Choisissez sa durée de visibilité.</p><button class="btn" id="addStatus">Ajouter un statut</button></div>`;

let selectedMessages=new Set(), longPressTimer=null, longPressTriggered=false;
function updateSelectionUI(){
 const active=selectedMessages.size>0;
 $("selectBar").classList.toggle("show",active);
 const head=document.querySelector(".chathead");if(head)head.style.display=active?"none":"flex";

}
function clearSelection(){selectedMessages.clear();updateSelectionUI();}
function drawMessages(){
 const box=$("chatMessages");box.innerHTML="";if(!activeChat)return;
 (activeChat.messages||[]).forEach((m,i)=>{
  const d=document.createElement("div");d.className="bubble "+(m.mine?"mine":"other");d.dataset.messageIndex=String(i);
  const ticks=m.mine?(m.status==="read"?"<span class=\"ticks read\">✓✓</span>":m.status==="delivered"?"<span class=\"ticks\">✓✓</span>":"<span class=\"ticks pending\">✓</span>"):"";
  d.innerHTML=`<span>${esc(m.text)}</span><small>${esc(m.time||"")} ${ticks}</small>`;
  d.addEventListener("pointerdown",()=>{longPressTriggered=false;clearTimeout(longPressTimer);longPressTimer=setTimeout(()=>{longPressTriggered=true;selectedMessages.add(i);updateSelectionUI();},500)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>d.addEventListener(ev,()=>clearTimeout(longPressTimer)));
  d.addEventListener("contextmenu",ev=>{ev.preventDefault();longPressTriggered=true;selectedMessages.add(i);updateSelectionUI()});
  d.addEventListener("click",()=>{if(longPressTriggered){longPressTriggered=false;return;}if(selectedMessages.size){if(selectedMessages.has(i))selectedMessages.delete(i);else selectedMessages.add(i);updateSelectionUI();}});
  box.appendChild(d);
 });box.scrollTop=box.scrollHeight;updateSelectionUI();
}
function deleteSelectedMessages(){

function sendMessage(){
 const text=$("messageInput").value.trim();if(!text||!activeChat)return;
 const chat=activeChat;
 const msg={text,mine:true,status:"pending",time:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})};
 chat.messages.push(msg);chat.updated=Date.now();chat.time="Maintenant";
 $("messageInput").value="";playMessageSound();drawMessages();save();
 if(chat.kind==="ai"||chat.name==="Israël-AI")sendToAI(text,chat,msg);
 else toast("Message conservé sur cet appareil. L'envoi à cette personne nécessite une connexion ANISRA.");
}
async function sendToAI(text,chat=activeChat,outgoing=null){
 if(!chat || !(chat.kind==="ai"||chat.name==="Israël-AI"))return;
 const presence=$("chatPresence");if(activeChat===chat&&presence)presence.textContent="Israël-AI écrit…";
 const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),90000);
 try{
  const response=await fetch(new URL("api/chat",AI_SERVER).toString(),{method:"POST",mode:"cors",credentials:"omit",headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify({message:text}),signal:controller.signal});
  const raw=await response.text();let data;try{data=JSON.parse(raw)}catch(e){throw new Error("Réponse serveur non JSON (HTTP "+response.status+").")}
  if(!response.ok)throw new Error(data.error||data.message||("Erreur HTTP "+response.status));
  if(data.success===false)throw new Error(data.error||data.message||"Le serveur a refusé le message.");
  const reply=String(data.reply||data.response||data.message||"").trim();if(!reply)throw new Error("Le serveur n'a pas envoyé de texte de réponse.");
  if(outgoing)outgoing.status="delivered";
  chat.messages.push({text:reply,mine:false,time:new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})});chat.updated=Date.now();chat.time="Maintenant";save();playMessageSound();
  if(activeChat===chat)drawMessages();if(activeChat===chat&&presence)presence.textContent="En ligne";
 }catch(error){
  const reason=error.name==="AbortError"?"Délai dépassé : le serveur ne répond pas.":error.message;
  if(activeChat===chat&&presence)presence.textContent="Connexion impossible";
  toast("Israël_AI : "+(reason.includes("Failed to fetch")?"échec réseau/CORS. Le serveur doit autoriser l'origine ANISRA.":reason));
  console.error("ANISRA / Israël-AI:",error);
 }finally{clearTimeout(timeout)}
}

 $("chatWallpaper").onclick=()=>{modal("Fond d’écran",`<p class="muted">Choisissez une image pour l’arrière-plan de cette discussion.</p><input class="field" type="file" id="wallpaperFile" accept="image/*"><div class="btnrow"><button class="btn" id="applyWallpaper">Appliquer</button><button class="btn secondary" id="removeWallpaper">Retirer le fond</button></div>`);$("applyWallpaper").onclick=()=>{const f=$("wallpaperFile").files[0];if(!f)return toast("Choisissez une image.");const r=new FileReader();r.onload=()=>{activeChat.wallpaper=r.result;$("chatMessages").style.backgroundImage=`linear-gradient(#f4f5fa99,#f4f5fa99),url("${r.result}")`;$("chatMessages").style.backgroundSize="cover";save();closeModal();toast("Fond d’écran enregistré localement.")};r.readAsDataURL(f)};$("removeWallpaper").onclick=()=>{delete activeChat.wallpaper;$("chatMessages").style.backgroundImage="";save();closeModal();toast("Fond d’écran retiré.")}};
 $("chatColor").onclick=()=>{modal("Couleur de discussion",`<label>Couleur des messages envoyés</label><input id="chatColorPicker" type="color" value="${activeChat.color||"#e9e2ff"}" style="width:100%;height:48px"><div class="btnrow"><button class="btn" id="applyChatColor">Appliquer</button></div>`);$("applyChatColor").onclick=()=>{activeChat.color=$("chatColorPicker").value;document.querySelectorAll(".bubble.mine").forEach(b=>b.style.background=activeChat.color);save();closeModal();toast("Couleur enregistrée.")}};
 $("chatMute").onclick=()=>{activeChat.muted=!activeChat.muted;save();closeModal();toast(activeChat.muted?"Discussion mise en sourdine dans cette maquette.":"Sourdine désactivée.")};
 $("chatArchive").onclick=()=>{activeChat.archived=true;save();closeModal();$("chatView").classList.remove("open");chatHistoryOpen=false;render();toast("Discussion archivée localement.")};
 $("chatUnread").onclick=()=>{activeChat.unread=1;save();closeModal();$("chatView").classList.remove("open");chatHistoryOpen=false;render();toast("Discussion marquée comme non lue.")};
 $("chatClear").onclick=()=>{if(confirm("Effacer tous les messages de cette discussion ? Cette action ne peut pas être annulée.")){activeChat.messages=[];activeChat.updated=Date.now();save();drawMessages();closeModal();toast("Discussion effacée.")}};
};
$("chatCall").onclick=()=>callForm("vocal");$("chatVideo").onclick=()=>callForm("vidéo");
$("modalClose").onclick=()=>closeModal();$("modalBack").onclick=e=>{if(e.target===$("modalBack"))closeModal()};
window.addEventListener("popstate",()=>{handlingPopState=true; if(selectedMessages.size){clearSelection();}else if($("modalBack").classList.contains("show")){closeModal(true);modalHistoryOpen=false;}else if($("chatView").classList.contains("open")){ $("chatView").classList.remove("open");activeChat=null;chatHistoryOpen=false;render();}else if(currentTab!=="Discussions"){currentTab="Discussions";render()} handlingPopState=false;});
// Soutien au bouton Retour physique dans les APK qui exposent Capacitor.
if(window.Capacitor?.Plugins?.App?.addListener){window.Capacitor.Plugins.App.addListener("backButton",()=>{if(selectedMessages.size)clearSelection();else if($("modalBack").classList.contains("show"))closeModal();else if($("chatView").classList.contains("open")){ $("chatView").classList.remove("open");activeChat=null;chatHistoryOpen=false;render()}else if(currentTab!=="Discussions"){currentTab="Discussions";render()}else if(confirm("Quitter ANISRA ?")){window.close()}}).catch(()=>{});}
applySettings();render();
</script>
</body>
</html>
